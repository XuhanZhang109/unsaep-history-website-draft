0.php","box":"Box 8","title":"Item 2 - Leaders of Distinction; with Thomas Eagleton, (1” Videotape; Master), July 1986","format":"1″ Videotape; Master","category":"Video tape"},{"call":"UW:4/143/3","url":"https://muarchives.missouri.edu/uw-rg4-s90.php","box":"Box 8","title":"Item 3 - Leaders of Distinction; with John Ashcroft, (1” Videotape; Master), July 1986","format":"1″ Videotape; Master","category":"Video tape"}];
    const search = document.getElementById('search');
    const callFilter = document.getElementById('call-filter');
    const formatFilter = document.getElementById('format-filter');
    const rows = document.getElementById('rows');
    const count = document.getElementById('result-count');
    records.forEach((record, index) => { record.index = String(index + 1).padStart(3, '0'); });

    function cell(value, className) {
      const td = document.createElement('td');
      if (className) td.className = className;
      td.textContent = value || '—';
      return td;
    }
    function addOption(select, value) {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = value;
      select.append(option);
    }
    [...new Set(records.map(record => record.call))].forEach(value => addOption(callFilter, value));
    [...new Set(records.map(record => record.category).filter(Boolean))].sort().forEach(value => addOption(formatFilter, value));

    function render() {
      const query = search.value.trim().toLocaleLowerCase();
      const filtered = records.filter(record => {
        if (callFilter.value && record.call !== callFilter.value) return false;
        if (formatFilter.value && record.category !== formatFilter.value) return false;
        return !query || [record.index, record.call, record.box, record.title, record.format, record.category].join(' ').toLocaleLowerCase().includes(query);
      });
      rows.replaceChildren();
      const fragment = document.createDocumentFragment();
      for (const record of filtered) {
        const tr = document.createElement('tr');
        const callCell = document.createElement('td');
        callCell.className = 'call';
        const link = document.createElement('a');
        link.href = record.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = record.call;
        link.setAttribute('aria-label', `${record.call} — open University Archives finding aid`);
        callCell.append(link);
        const notesCell = document.createElement('td');
        notesCell.className = 'notes';
        tr.append(cell(record.index, 'index'), callCell, cell(record.box, 'box'), cell(record.title), cell(record.format, 'format'), notesCell);
        fragment.append(tr);
      }
      if (!filtered.length) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = 6;
        td.className = 'empty';
        const strong = document.createElement('strong');
        strong.textContent = 'No matching entries';
        td.append(strong, document.createTextNode('Try another search or clear the filters.'));
        tr.append(td);
        fragment.append(tr);
      }
      rows.append(fragment);
      count.textContent = `${filtered.length.toLocaleString()} of ${records.length.toLocaleString()} entries`;
    }
    [search, callFilter, formatFilter].forEach(control => control.addEventListener('input', render));
    document.getElementById('reset').addEventListener('click', () => {
      search.value = '';
      callFilter.value = '';
      formatFilter.value = '';
      render();
      search.focus();
    });
    render();
  </script>
